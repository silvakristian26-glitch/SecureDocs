{% extends "base.html" %}
{% block conteudo %}
<h1>Auditoria</h1>
<div class="tabela">
<table>
  <thead><tr><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Registro</th><th>IP</th></tr></thead>
  <tbody>
  {% for l in logs %}
    <tr>
      <td>{{ l.data_hora.strftime('%d/%m/%Y %H:%M:%S') }}</td>
      <td>{{ l.nome or '—' }}</td>
      <td>{{ l.acao }}</td>
      <td>{{ l.entidade or '' }} {{ l.entidade_id or '' }}</td>
      <td>{{ l.ip }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
